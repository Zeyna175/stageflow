services:
  db:
    image: postgres:16
    container_name: stageflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stageflow
      POSTGRES_PASSWORD: stageflow
      POSTGRES_DB: stageflow
    ports:
      - "5433:5432"
    volumes:
      - stageflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stageflow -d stageflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: stageflow-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://stageflow:stageflow@db:5432/stageflow
      SECRET_KEY: dev-secret-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ENVIRONMENT: development
      PROJECT_NAME: StageFlow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  stageflow_pgdata:
